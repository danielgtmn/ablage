name: Feature request
description: An idea for ablage
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, in your own words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could ablage help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Repository, Conditions and queries, Stores (SQLite, Postgres, memory), New store, Migrations, Docs, Other]
